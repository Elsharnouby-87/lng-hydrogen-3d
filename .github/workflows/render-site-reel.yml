name: Cinematic WebGL Desktop Mobile Flow Capture
on:
  push:
    branches:
      - video-site-only-linkedin-2026
    paths:
      - .github/workflows/render-site-reel.yml
      - .github/video/render_guided_showcase.py
      - .github/video/capture_cinematic_flows.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-site-only-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact website source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture and audio dependencies
        run: |
          python -m pip install --quiet playwright numpy
          python -m playwright install --with-deps chromium
      - name: Install FFmpeg encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Build unmodified 3D website plus private on-branch camera controls
        run: |
          npm ci
          npm run build
      - name: Capture actual moving 3D flows in desktop and mobile scenes
        run: python .github/video/capture_cinematic_flows.py
      - name: Upload finished MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OAPEC-2026-animated-E101-R101-desktop-mobile-raw
          path: |
            cinematic_raw/*.mp4
            cinematic_raw/*_QA.png
            cinematic_raw/capture_manifest.json
          if-no-files-found: warn
          retention-days: 14
