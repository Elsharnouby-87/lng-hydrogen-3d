name: Guided Website-only 3D Showcase (33.6 sec)
on:
  push:
    branches:
      - video-site-only-linkedin-2026
    paths:
      - .github/workflows/render-site-reel.yml
      - .github/video/render_guided_showcase.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-site-only-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact website source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture and audio dependencies
        run: |
          python -m pip install --quiet playwright numpy
          python -m playwright install --with-deps chromium
      - name: Install FFmpeg encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Build unmodified 3D website plus private on-branch camera controls
        run: |
          npm ci
          npm run build
      - name: Record professionally guided 3D website with original high-energy music
        run: xvfb-run -a -s "-screen 0 1280x720x24" python .github/video/render_guided_showcase.py
      - name: Upload finished MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OAPEC-2026-guided-website-3D-LinkedIn-reel
          path: |
            oapec_guided_reel/OAPEC_2026_3D_Guided_Website_Only_33s.mp4
            oapec_guided_reel/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish download-ready MP4 on isolated video branch
        if: success()
        run: |
          mkdir -p showcase
          cp oapec_guided_reel/OAPEC_2026_3D_Guided_Website_Only_33s.mp4 showcase/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/OAPEC_2026_3D_Guided_Website_Only_33s.mp4
          git commit -m "Publish guided website-only 3D showcase [skip ci]"
          git push origin HEAD:video-site-only-linkedin-2026
