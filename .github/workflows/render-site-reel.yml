name: Site-only 3D LinkedIn Reel (33 sec)
on:
  push:
    branches:
      - video-site-only-linkedin-2026
    paths:
      - .github/workflows/render-site-reel.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-site-only-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact website source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture and audio dependencies
        run: |
          python -m pip install --quiet playwright numpy
          python -m playwright install --with-deps chromium
      - name: Install FFmpeg encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Record real site screens and synthesize original energetic instrumental
        run: python .github/video/render_site_video.py
      - name: Upload finished MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OAPEC-2026-website-only-3D-LinkedIn-video
          path: |
            oapec_site_video/OAPEC_Website_Only_3D_LinkedIn_33s.mp4
          if-no-files-found: warn
          retention-days: 14
      - name: Publish download-ready MP4 on isolated video branch
        if: success()
        run: |
          mkdir -p showcase
          cp oapec_site_video/OAPEC_Website_Only_3D_LinkedIn_33s.mp4 showcase/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/OAPEC_Website_Only_3D_LinkedIn_33s.mp4
          git commit -m "Publish website-only 33-second 3D reel [skip ci]"
          git push origin HEAD:video-site-only-linkedin-2026
