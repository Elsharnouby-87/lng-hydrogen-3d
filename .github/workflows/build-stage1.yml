name: Build Stage 1 R-101 demonstrator
on:
  push:
    branches: [stage-1-advanced-r101]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/test-coldbox.mjs
      - run: npm run build
      - name: Verify self-contained conference artifact
        run: |
          node -e "const fs=require('fs');const p=fs.readFileSync('docs/index.html','utf8');if(!p.includes('Helium only')||!p.includes('Exploded')||!p.includes('R-101'))process.exit(1)"
      - name: Commit compiled single-file site to feature branch
        run: |
          if ! git diff --quiet docs/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Build Stage 1 self-contained site [skip ci]"
            git push
          fi
