name: Build Stage 1 R-101 demonstrator
on:
  push:
    branches: [stage-1-advanced-r101, fix-r101-mobile-info-overlay]
  workflow_dispatch:
concurrency:
  group: r101-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/test-coldbox.mjs
      - run: npm run build
      - name: Headless Chromium R-101 visual and interaction smoke tests
        run: node tools/qa-coldbox-browser.mjs
      - name: Verify self-contained conference artifact
        run: |
          node -e "const fs=require('fs');const p=fs.readFileSync('docs/index.html','utf8');if(!p.includes('Helium only')||!p.includes('Exploded')||!p.includes('R-101'))process.exit(1)"
      - name: Commit compiled single-file site to feature branch
        run: |
          git add docs/index.html docs/r101-stage1-*.png docs/r101-mobile-*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build R-101 mobile-safe self-contained site [skip ci]"
            git push
          fi
