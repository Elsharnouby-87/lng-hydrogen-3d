name: Build Stage 3 equipment and visual QA
on:
  push:
    branches: [stage-3-industrial-equipment-detailing]
  workflow_dispatch:
concurrency:
  group: industrial-stage3-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/test-coldbox.mjs
      - run: node tools/test-industrial.mjs
      - run: npm run build
      - name: WebGL camera, controls and desktop/mobile equipment inspection
        run: node tools/qa-coldbox-browser.mjs
      - name: Verify single-file deployment asset
        run: |
          node -e "const fs=require('fs');const t=fs.readFileSync('docs/index.html','utf8');for(const s of ['K-101','P-201','TK-301','Helium only'])if(!t.includes(s))process.exit(1)"
      - name: Persist self-contained site and closeup QA snapshots
        run: |
          git add docs/index.html docs/r101-stage1-*.png docs/r101-mobile-*.png docs/stage3-*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build Stage 3 inspection artifact [skip ci]"
            git push
          fi
