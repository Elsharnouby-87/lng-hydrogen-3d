name: Stage 5 — Full Equipment-Level 3D QA
on:
  push:
    branches: [stage5-full-equipment-level-detailing]
  workflow_dispatch:
concurrency:
  group: stage5-equipment-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  engineering-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Legacy R-101 regression
        run: node tools/test-coldbox.mjs
      - name: Legacy plant equipment and process nozzle regression
        run: node tools/test-industrial.mjs
      - name: Stage 5 mechanical assemblies and cutaway assertions
        run: node tools/test-detailing.mjs
      - name: Compile self-contained site
        run: npm run build
      - name: Chrome 3D close-up and responsive regression
        run: node tools/qa-coldbox-browser.mjs
      - name: Verify equipment controls survived bundling
        run: |
          node -e "const fs=require('fs');let s=fs.readFileSync('docs/index.html','utf8');for(const x of ['Vacuum cutaway','Tank shell','R-101','E-202','P-201'])if(!s.includes(x))process.exit(1)"
      - name: Save standalone site and view snapshots to branch
        run: |
          git add docs/index.html docs/stage5-*.png docs/stage3-*.png docs/r101-stage1-*.png docs/r101-mobile-*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build Stage 5 standalone site and visuals [skip ci]"
            git push
          fi
