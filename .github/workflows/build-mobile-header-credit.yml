name: Mobile author credit — visual regression
on:
  push:
    branches: [mobile-header-signature-credit]
  workflow_dispatch:
concurrency:
  group: mobile-credit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate author credit, Chrome mobile 390 and 320 viewport, and R101 regression
        run: node tools/qa-coldbox-browser.mjs
      - name: Publish updated standalone page and visual previews to branch
        run: |
          git add docs/index.html docs/mobile3d-*.png docs/mobile3d-*.jpg docs/r101-stage1-*.png docs/r101-mobile-*.png docs/stage3-*.png docs/stage5-*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build visible mobile creator credit [skip ci]"
            git push
          fi
